name: Generate Prime launcher mipmaps
on:
  push:
    branches: [Prime-identity]
    paths:
      - 'scripts/generate_prime_mipmaps.py'
      - 'docs/prime/prime-logo.svg'
      - '.github/workflows/generate-prime-mipmaps.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Prime-identity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cairosvg pillow
      - run: python scripts/generate_prime_mipmaps.py
      - name: Commit regenerated PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/mipmap-*/ic_launcher_home*.png
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate all Prime Launcher legacy mipmap PNGs"
            git push
          fi
