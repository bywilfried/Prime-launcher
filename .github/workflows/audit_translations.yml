name: Audit translations
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'prime/res/values*/**'
      - 'scripts/audit_translations.py'
      - '.github/workflows/audit_translations.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Audit Prime resources
        run: python3 scripts/audit_translations.py --json translation-audit.json
      - uses: actions/upload-artifact@v7
        with:
          name: translation-audit
          path: translation-audit.json
          if-no-files-found: error
