name: Publish Prime Stable

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prime-stable-publish
  cancel-in-progress: false

jobs:
  build-release-apk:
    name: Publish Prime Stable
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Read stable version and check tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^VERSION_NAME=//p' version.properties)"
          code="$(sed -n 's/^VERSION_CODE=//p' version.properties)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$code" =~ ^[0-9]+$ ]]
          if git ls-remote --exit-code --tags origin "refs/tags/v$version"; then
            echo "::error::Stable tag already exists"
            exit 1
          else
            test "$?" -eq 2
          fi
          echo "PRIME_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "PRIME_VERSION_CODE=$code" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Signing
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.PRIME_KEYSTORE_BASE64 }}"
          test -n "${{ secrets.PRIME_KEYSTORE_PASSWORD }}"
          test -n "${{ secrets.PRIME_KEY_ALIAS }}"
          test -n "${{ secrets.PRIME_KEY_PASSWORD }}"
          printf '%s' "${{ secrets.PRIME_KEYSTORE_BASE64 }}" | base64 --decode > "$GITHUB_WORKSPACE/key.jks"
          {
            echo "storePassword=${{ secrets.PRIME_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.PRIME_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.PRIME_KEY_PASSWORD }}"
            echo "storeFile=$GITHUB_WORKSPACE/key.jks"
          } > keystore.properties

      - name: Build Release APK (${{ env.PRIME_RELEASE_VERSION }})
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleLawnWithQuickstepGithubRelease -PprimeStable=true --warning-mode=none 2>&1 | sed \
            -e '/^w: /d' \
            -e '/^warning: /d' \
            -e '/^Warning: /d' \
            -e '/^To suppress the warning do one of the following:$/d'

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find build/outputs/apk -type f -path '*/release/*' -name '*.apk' -print -quit)"
          test -n "$apk"
          mkdir -p artifact
          cp "$apk" artifact/Prime-Launcher-Stable.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Prime-Launcher-Stable-APK
          path: artifact/Prime-Launcher-Stable.apk
          if-no-files-found: error

      - name: Verify APK version
        shell: bash
        run: |
          set -euo pipefail
          aapt="$ANDROID_HOME/build-tools/37.0.0/aapt"
          badging="$("$aapt" dump badging artifact/Prime-Launcher-Stable.apk)"
          grep -F "package: name='com.bywilfried.prime.stable'" <<< "$badging"
          grep -F "versionCode='$PRIME_VERSION_CODE'" <<< "$badging"
          grep -F "versionName='$PRIME_RELEASE_VERSION'" <<< "$badging"

      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v$PRIME_RELEASE_VERSION" artifact/Prime-Launcher-Stable.apk --target "$GITHUB_SHA" --title "Prime Launcher $PRIME_RELEASE_VERSION" --generate-notes
