        FRAMEWORK_PREBUILTS_DIR = "$rootDir/prebuilts/libs"

        // Maven Central framework inputs, used only at compile time.
        frameworkMavenVersions = [
            'framework-10.jar': '10-robolectric-5803371',
            'framework-11.jar': '11-robolectric-6757853',
            'framework-12.jar': '12-robolectric-7732740',
            'framework-13.jar': '13-robolectric-9030017',
            'framework-14.jar': '14-robolectric-10818077',
            'framework-15.jar': '15-robolectric-12650502'
        ]

        addFrameworkJar = { String name ->
            def version = frameworkMavenVersions[name]
            if (name != "framework-16.jar" && version == null) {
                throw new IllegalArgumentException("Unknown framework input: ${name}")
            }
            def frameworkJar
            if (name == "framework-16.jar") {
                frameworkJar = files("$FRAMEWORK_PREBUILTS_DIR/$name")
            } else {
                frameworkJar = configurations.detachedConfiguration(
                    dependencies.create("org.robolectric:android-all:${version}")
                )
                frameworkJar.transitive = false
            }
            gradle.projectsEvaluated {
                tasks.withType(JavaCompile).configureEach {
                    classpath = files(frameworkJar, classpath)
                }
                tasks.withType(KotlinCompile).configureEach {
                    libraries.setFrom files(frameworkJar, libraries)
                }
            }
            dependencies {
                compileOnly files(frameworkJar)
            }
        }

        compileOnlyCommonJars = {
            dependencies {
                compileOnly fileTree(dir: FRAMEWORK_PREBUILTS_DIR, include: 'SystemUI-core-16.jar')
                compileOnly fileTree(dir: FRAMEWORK_PREBUILTS_DIR, include: 'SystemUI-statsd-16.jar')
                compileOnly fileTree(dir: FRAMEWORK_PREBUILTS_DIR, include: 'WindowManager-Shell-16.jar')

                compileOnly projects.compatLib
                compileOnly projects.compatLib.compatLibVQ
                compileOnly projects.compatLib.compatLibVR
                compileOnly projects.compatLib.compatLibVS
                compileOnly projects.compatLib.compatLibVT
                compileOnly projects.compatLib.compatLibVU
                compileOnly projects.compatLib.compatLibVV
                compileOnly projects.compatLib.compatLibVBaklava
            }
        }
    }
}

final def buildCommit = providers.exec {
    commandLine('git', 'rev-parse', '--short=7', 'HEAD')
}.standardOutput.asText.get().trim()

// Prime's public minor version is changed deliberately (e.g. 0.9).
// The final component identifies the CI build, for both debug and release.
// Release 0.9 numbering starts at GitHub Actions release run #69.
// Dev builds deliberately keep the existing 0.8 / run-number scheme.
final def primeStable = providers.gradleProperty("primeStable").orNull == "true"
final def isPrime09Release = !primeStable && System.getenv("PRIME_RELEASE_09") == "true"
final def primeMajor = 0
final def primeMinor = isPrime09Release ? 9 : 8
final def ciRunNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "").trim()
final def ciBuildNumber = primeStable ? 0 : (providers.gradleProperty("primeBuildNumber").orNull
        ?: (ciRunNumber ? ciRunNumber : (isPrime09Release ? "69" : "0"))).toInteger()
final def primeBuildNumber = isPrime09Release ? ciBuildNumber - 69 : ciBuildNumber
if (primeBuildNumber < 0 || primeBuildNumber > 999999) {
    throw new GradleException("primeBuildNumber must be between 0 and 999999")
}
final def stableVersion = new Properties()
if (primeStable) {
    rootProject.file("version.properties").withInputStream { stableVersion.load(it) }
    if (!(stableVersion.getProperty("VERSION_NAME") ==~ /[0-9]+\.[0-9]+\.[0-9]+/)) {
        throw new GradleException("Invalid stable VERSION_NAME")
    }
    if (!(stableVersion.getProperty("VERSION_CODE") ==~ /[0-9]+/)) {
        throw new GradleException("Invalid stable VERSION_CODE")
    }
    if (stableVersion.getProperty("VERSION_CODE").toLong() < 11000000 || stableVersion.getProperty("VERSION_CODE").toLong() > 2100000000) {
        throw new GradleException("Stable VERSION_CODE outside allowed range")
    }
}
final def primeBaseVersion = primeStable ? stableVersion.getProperty("VERSION_NAME") : "${primeMajor}.${primeMinor}.${primeBuildNumber}"
final def primeDebugVersion = "${primeBaseVersion}-debug"
final def primeVersionCode = (isPrime09Release ? 9000000 : 8000000) + primeBuildNumber
final def majorVersion = primeStable ? primeBaseVersion.tokenize(".")[0] : "${primeMajor}"

final def quickstepMinSdk = "35"
final def quickstepMaxSdk = "36"

android {
    namespace "com.android.launcher3"
    defaultConfig {
        applicationId "com.bywilfried.prime.fdroid"
        versionCode (primeStable ? stableVersion.getProperty("VERSION_CODE").toInteger() : primeVersionCode + primeBuildNumber)
        versionName primeBaseVersion
        buildConfigField "String", "VERSION_DISPLAY_NAME", "\"${primeBaseVersion}\""
        buildConfigField "String", "MAJOR_VERSION", "\"${majorVersion}\""
        buildConfigField "String", "COMMIT_HASH", "\"${buildCommit}\""
        buildConfigField "boolean", "ENABLE_AUTO_INSTALLS_LAYOUT", "false"

        manifestPlaceholders.quickstepMinSdk = quickstepMinSdk
        manifestPlaceholders.quickstepMaxSdk = quickstepMaxSdk
        buildConfigField "int", "QUICKSTEP_MIN_SDK", quickstepMinSdk
        buildConfigField "int", "QUICKSTEP_MAX_SDK", quickstepMaxSdk
    }

    androidResources {
        generateLocaleConfig true
    }

    buildFeatures {
        aidl true
        buildConfig true
        resValues true
    }

    packagingOptions.resources.excludes += [
        "**/*.proto",
        "**/*.bin",
        "**/*.java",
        "**/*.properties",
        "**/*.version",
        "**/*.*_module",
        "com/**",
        "google/**",
        "kotlin/**",
        "kotlinx/**",
        "okhttp3/**",
        "META-INF/services/**",
        "META-INF/com/**",
        "META-INF/licenses/**",
        "META-INF/AL2.0",
        "META-INF/LGPL2.1",
    ]

    // Load all proguard configs from AOSP
    def proguardFilesFromAosp = allprojects.collect { proj ->
        [
            'proguard.flags',
            'proguard_flags.flags',
            'proguard_plugins.flags'
        ].collect { proj.file(it) }
    }.flatten().findAll { it.exists() }.toArray()

    def releaseSigning
    try {
        def keystoreProperties = new Properties()
        keystoreProperties.load(rootProject.file("keystore.properties").newInputStream())
        releaseSigning = signingConfigs.create("release") {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile rootProject.file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    } catch (Exception ignored) {
        releaseSigning = primeStable ? null : signingConfigs.debug
    }

    buildTypes {
        all {
            signingConfig releaseSigning
            pseudoLocalesEnabled true
        }

        debug {
            versionNameSuffix "-debug"
            buildConfigField "String", "VERSION_DISPLAY_NAME", "\"${primeDebugVersion}\""
            applicationIdSuffix ".debug"
            resValue("string", "derived_app_name", "Prime Launcher (Dev)")

            manifestPlaceholders.quickstepMinSdk = "0"
            manifestPlaceholders.quickstepMaxSdk = "100000"
            buildConfigField "int", "QUICKSTEP_MIN_SDK", "0"
            buildConfigField "int", "QUICKSTEP_MAX_SDK", "100000"
        }

        release {
            resValue("string", "derived_app_name", providers.gradleProperty("primeFdroidCheck").orNull == "true" ? "Prime Launcher (F-Droid Check)" : "Prime Launcher")
            minifyEnabled true
            shrinkResources true
            pseudoLocalesEnabled false
            proguardFiles proguardFilesFromAosp + "proguard.pro"
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    // See: https://developer.android.com/studio/build/build-variants#flavor-dimensions
    flavorDimensions += ["app", "recents", "channel"]

    productFlavors {
        prime {
            dimension "app"
        }

        withQuickstep {
            dimension "recents"
            minSdk = 26
        }

        github {
            applicationId (primeStable ? 'com.bywilfried.prime.stable' : 'com.bywilfried.prime')
            dimension "channel"
        }

        fdroid {
            applicationId "com.bywilfried.prime.fdroid"
            dimension "channel"
        }

        nightly {
            applicationId 'com.bywilfried.prime.nightly'
            dimension "channel"
        }

        play {
            applicationId "com.bywilfried.prime.play"
            dimension "channel"
            isDefault true
        }

        configureEach {
            resValue("string", "launcher_component", "${applicationId}/app.lawnchair.LawnchairLauncher")
        }
    }

    sourceSets {
        main {
            res.srcDirs = ['res']

            // Lawnchair-TODO: Don't include Compose Disabled, but there's has to be another way of making this NOT long
            java.srcDirs = ['src', 'src_plugins', 'compose/facade/core', 'compose/facade/enabled', 'compose/features']
            kotlin.directories.addAll('src', 'src_plugins', 'compose/facade/core', 'compose/facade/enabled', 'compose/features')

            manifest.srcFile 'AndroidManifest-common.xml'
            proto {
                srcDirs = ['protos/', 'quickstep/protos_overrides/']
            }
        }

        prime {
            java.srcDirs = ['src_flags', 'src_shortcuts_overrides', 'prime/src', 'tests/shared']
            kotlin.directories.addAll('src_flags', 'src_shortcuts_overrides', 'prime/src', 'tests/shared')
            aidl.srcDirs = ['prime/aidl']
            res.srcDirs = ['prime/res', 'platform_frameworks_libs_systemui/animationlib/res']
            manifest.srcFile "prime/AndroidManifest.xml"
            assets {
                srcDirs 'prime/assets'
            }
            proto {
                srcDirs = ['prime/protos/']
            }
        }

        github {
            manifest.srcFile "github/AndroidManifest.xml"
        }

        fdroid {
            manifest.srcFile "github/AndroidManifest.xml"
        }

        nightly {
            manifest.srcFile "nightly/AndroidManifest.xml"
            res.srcDirs = ["nightly/res"]
        }

        primeWithQuickstepGithub {
            manifest.srcFile "quickstep/AndroidManifest-launcher.xml"
        }

        primeWithQuickstepFdroid {
            manifest.srcFile "quickstep/AndroidManifest-launcher.xml"
        }

        primeWithQuickstepNightly {
            manifest.srcFile "quickstep/AndroidManifest-launcher.xml"
        }

        primeWithQuickstepPlay {
            manifest.srcFile "quickstep/AndroidManifest-launcher.xml"
        }

        withQuickstep {
            res.srcDirs = ['quickstep/res', 'quickstep/recents_ui_overrides/res']
            java.srcDirs = ['quickstep/src', 'quickstep/dagger', 'quickstep/recents_ui_overrides/src', 'quickstep/src_protolog']
            kotlin.directories.addAll('quickstep/src', 'quickstep/dagger', 'quickstep/recents_ui_overrides/src', 'quickstep/src_protolog')
            manifest.srcFile "quickstep/AndroidManifest.xml"
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def channel = variant.productFlavors.last().second
        variant.outputs.forEach { output ->
            output.outputFileName.set("${primeStable ? 'Prime-Launcher' : 'Lawnchair'}.${output.versionName.get()}.$channel.${variant.buildType}.apk")
        }

        // Lawnchair-TODO: A better way to sync proto file to the IDE preventing missing or outdated result. Please remove if this is the best solution we have right now
        def capitalizedVariantName = variant.name.substring(0, 1).toUpperCase(java.util.Locale.ROOT) + variant.name.substring(1)
        def generatedProtoJavaDir = layout.buildDirectory
            .dir("generated/java/generate${capitalizedVariantName}Proto/java")
            .get()
            .asFile
        variant.sources.java.addStaticSourceDirectory(generatedProtoJavaDir.absolutePath)
    }
}

